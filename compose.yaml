services:
  postgres:
    image: postgres:17-alpine
    container_name: varelion-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:7270:5432"
    environment:
      POSTGRES_USER: varelion
      POSTGRES_PASSWORD: varelion_local_dev
      POSTGRES_DB: varelion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varelion -d varelion"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
